models:
  User:
    name: required string:255 min:2
    email: required unique email string:255 min:2
    password: required string:400 min:6
    email_verified_at: nullable datetime
    last_login_datetime: nullable datetime
    last_login_os: nullable string:50
    last_login_ip: nullable ipaddress
    last_login_useragent: nullable text
    timestamps: true

  Product:
    name: required string:255 min:2
    sku: required unique string:100
    price: required decimal:8,2
    stock_quantity: required integer min:0
    description: nullable text
    timestamps: true
    relationships:
      belongsTo: Category

  Category:
    name: required string:255 min:2
    description: nullable text
    timestamps: true
    relationships:
      hasMany: Product

  Sale:
    user_id: required foreignId:users
    total_amount: required decimal:8,2
    payment_method: required enum:cash,credit_card
    created_at: nullable datetime
    timestamps: true
    relationships:
      hasMany: SaleItem
      morphMany: Transaction

  SaleItem:
    sale_id: required foreignId:sales
    product_id: required foreignId:products
    quantity: required integer min:1
    price: required decimal:8,2
    total: required decimal:8,2
    timestamps: true

  Stock:
    product_id: required foreignId:products
    quantity: required integer
    type: required enum:purchase,adjustment,return
    created_at: nullable datetime
    timestamps: true
    relationships:
      morphMany: Transaction

  Supplier:
    name: required string:255
    contact_information: required string:255
    timestamps: true

  PurchaseOrder:
    supplier_id: required foreignId:suppliers
    total_amount: required decimal:8,2
    status: required enum:pending,received,canceled default:'pending'
    created_at: nullable datetime
    timestamps: true
    relationships:
      hasMany: PurchaseOrderItem
      morphMany: Transaction

  PurchaseOrderItem:
    purchase_order_id: required foreignId:purchase_orders
    product_id: required foreignId:products
    quantity: required integer min:1
    price: required decimal:8,2
    total: required decimal:8,2
    timestamps: true

  Transaction:
    transaction_type: required enum:sale,purchase,stock
    user_id: required foreignId:users
    transactable_id: required unsignedBigInteger
    transactable_type: required string
    amount: required decimal:8,2
    details: nullable json
    timestamps: true
    relationships:
      morphTo: transactable

seeders:
  User, Product, Category, Supplier

controllers:
  User:
    resource
  Product:
    resource
  Category:
    resource
  Sale:
    resource
  Stock:
    resource
  Supplier:
    resource
  PurchaseOrder:
    resource
  Transaction:
    resource
